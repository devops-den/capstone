name: Capstone CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Validate Lambda syntax
        run: python -m py_compile index.py

      - name: Run basic test
        run: |
          python -c "from index import handler; print(handler({}, None))"
